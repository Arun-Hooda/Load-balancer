services:
  app1:
    build: ./app
    environment:
      SERVER_NAME: "Server 1"
  app2:
    build: ./app
    environment:
      SERVER_NAME: "Server 2"
  app3:
    build: ./app
    environment:
      SERVER_NAME: "Server 3"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1
      - app2
      - app3
